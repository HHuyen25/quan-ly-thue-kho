version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: quan_ly_thue_kho
      JWT_SECRET: doi-chuoi-bi-mat-nay-truoc-khi-chay-production
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"

volumes:
  mongo_data:
